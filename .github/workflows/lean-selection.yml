name: Lean selection lemmas
on:
  workflow_dispatch:
  push:
    paths: ['lean/**', '.github/workflows/lean-selection.yml']
  pull_request:
    paths: ['lean/**', '.github/workflows/lean-selection.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: Selection FiniteSampling
          test: 'false'
          lint: 'false'
      - name: Inspect theorem axioms
        working-directory: lean
        run: lake env lean SelectionAudit.lean
      - name: Inspect finite-sampling scalar axioms
        working-directory: lean
        run: lake env lean FiniteSamplingAudit.lean
